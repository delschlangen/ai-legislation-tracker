# Read-only checks.
#
# This workflow runs validate.py and the standard-library test suite in tests/,
# and nothing else. It has read-only permissions, uses no secrets, fetches no
# external data, and never edits or commits a file. Its only effect is to pass
# or fail a pull request.
#
# The tests run the command-line tools against the real data, so a record that
# passes validation but would crash a tool, or a committed file that has drifted
# from the data it was generated from, fails here instead of after merge.
#
# It runs on every pull request and every push to main, whatever changed. The
# tests also read the README, the docs and both workflow files, and a check
# that only runs for some changes cannot be made a required check.
name: Validate data

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The README promises Python 3.7+, so test 3.7 itself. setup-python
          # only has 3.7 builds up to Ubuntu 22.04, so that version is pinned
          # to that image. ubuntu-latest no longer carries anything below 3.10.
          - python-version: '3.7'
            os: ubuntu-22.04
          - python-version: '3.12'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check data/*.json
        run: python3 validate.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
