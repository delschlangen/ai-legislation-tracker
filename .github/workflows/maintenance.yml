# Weekly maintenance report.
#
# Builds a checklist of what in the dataset needs a human to look at it: stale
# entries, dates that just passed, README dates in the past, broken source
# links, and anything official APIs report as newer than the record. It posts
# the checklist as a single GitHub issue titled "Maintenance report", updating
# that issue each week instead of opening new ones.
#
# What it can and cannot do:
# - It NEVER edits data or commits. Changing a record stays a human decision.
# - The "report" job only reads. Only the "publish" job may write, and only to
#   issues. It does not run on pull requests, so a PR can test the report but
#   cannot post anything.
# - Secrets are optional. Without CONGRESS_GOV_API_KEY it uses api.data.gov's
#   shared DEMO_KEY; without OPENSTATES_API_KEY it skips state bills. See
#   MAINTENANCE.md for how to add them.
#
# GitHub pauses scheduled workflows in a repository with no activity for 60
# days. If the report stops arriving, re-enable it from the Actions tab.
name: Maintenance report

on:
  schedule:
    - cron: '23 14 * * 1'   # Mondays, 14:23 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/maintenance.yml'

permissions:
  contents: read

concurrency:
  group: maintenance-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the report
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: >
          python3 scripts/maintenance_report.py --links --upstream
          --output report.md --attention-file attention.txt

      - name: Show the report on the run page
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-report
          path: |
            report.md
            attention.txt
          retention-days: 30

  publish:
    needs: report
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-report

      # The report body is passed as a file, never interpolated into a command.
      - name: Open or update the "Maintenance report" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Maintenance report"
          new_count=$(tr -dc '0-9' < attention.txt)
          new_count=${new_count:-0}

          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")

          if [ -z "$number" ]; then
            gh issue create --title "$title" --body-file report.md
            exit 0
          fi

          old_body=$(gh issue view "$number" --json body --jq .body)
          old_count=$(printf '%s' "$old_body" | grep -oE '\*\*[0-9]+ item' | head -n1 | tr -dc '0-9' || true)
          old_count=${old_count:-0}

          gh issue edit "$number" --body-file report.md

          # Editing an issue sends no notification. Comment only when there is
          # more to do than last week, so the issue does not become weekly noise.
          if [ "$new_count" -gt "$old_count" ]; then
            gh issue comment "$number" --body "The weekly report now lists $new_count item(s) to look at, up from $old_count. The issue description has the details."
          fi
