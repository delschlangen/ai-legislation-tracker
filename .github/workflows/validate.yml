# Read-only checks.
#
# This workflow runs validate.py and the standard-library test suite in tests/,
# and nothing else. It has read-only permissions, uses no secrets, fetches no
# external data, and never edits or commits a file. Its only effect is to pass
# or fail a pull request.
#
# The tests run the command-line tools against the real data, so a record that
# passes validation but would crash a tool, or a committed file that has drifted
# from the data it was generated from, fails here instead of after merge.
name: Validate data

on:
  pull_request:
    paths:
      - 'data/**'
      - 'src/**'
      - 'tests/**'
      - 'validate.py'
      - 'README.md'
      - 'examples/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/**'
      - 'tests/**'
      - 'validate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check data/*.json
        run: python3 validate.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
